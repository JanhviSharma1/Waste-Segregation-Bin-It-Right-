<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Zone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('Assets/bg6.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
        }

        @font-face {
            font-family: 'DistroBev';
            src: url('Assets/webfonts_Distro-Bev/Distro-Bev.ttf.woff') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .title {
            font-size: 3rem;
            color: #274935;
            text-align: center;
            margin-bottom: 20px;
            font-family: 'DistroBev';
        }

        .carousel img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            cursor: pointer;
        }

        .titles {
            margin-top: 20px;
            text-align: center;
        }

        .titles a {
            display: block;
            margin: 10px 0;
            font-size: 1.2rem;
            color: #274935;
            text-decoration: none;
            font-weight: bold;
        }

        .titles a:hover {
            text-decoration: underline;
            color: #28a745;
        }

        .back-btn {
            text-align: center;
            margin-top: 20px;
        }

        .back-btn a {
            text-decoration: none;
            color: white;
            background-color: #28a745;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }

        .back-btn a:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="title">Eco Adventures: The Waste Segregation Saga</h1>
        <div id="comicCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="Assets/comic-front.png" alt="Comic Panel 1"
                        onclick="openPDF('Assets/Comic/WasteInvadersPart1.pdf')">
                </div>
                <div class="carousel-item">
                    <img src="Assets/comic-front2.png" alt="Comic Panel 2"
                        onclick="openPDF('Assets/Comic/WasteInvadersPart2.pdf')">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#comicCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#comicCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <div class="titles">
            <a href="Assets/Comic/WasteInvadersPart1.pdf" target="_blank"> Waste Invaders (Part I) </a>
            <a href="Assets/Comic/WasteInvadersPart2.pdf" target="_blank"> Waste Invaders (Part II)</a>
        </div>

        <div class="back-btn">
            <a href="index.html">Back to Main Hub</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function openPDF(pdfUrl) {
            window.open(pdfUrl, '_blank');
        }
    </script>
</body>

</html>
